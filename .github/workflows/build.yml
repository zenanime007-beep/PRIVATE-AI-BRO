name: PRIVATE AI BRO Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f BRO-source.zip
          mkdir -p project
          unzip -q -o BRO-source.zip -d project
          test -f project/settings.gradle.kts || test -f project/settings.gradle
          echo "Source archive extracted successfully."
          if [ -d source ]; then cp -a source/. project/; fi

      - name: Apply verified Kotlin source fixes and BRO configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("project/app/src")
          def patch(path, pairs):
              p = root / path
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f"Expected source text not found in {path}: {old[:100]!r}")
                  s = s.replace(old, new)
              p.write_text(s)

          ui = root / "main/java/com/privateai/bro/Ui.kt"
          s = ui.read_text()
          s = s.replace("import androidx.compose.foundation.layout.matchParentSize\\n", "")
          ui.write_text(s)

          assistant = root / "main/java/com/privateai/bro/Assistant.kt"
          s = assistant.read_text()
          s = s.replace("fun setState(", "fun transitionTo(").replace("setState(", "transitionTo(")
          assistant.write_text(s)
          if "fun setState(" in s:
              raise SystemExit("JVM setter clash still present in Assistant.kt")

          main = root / "main/java/com/privateai/bro/MainActivity.kt"
          s = main.read_text()
          s = s.replace("HomeScreen(st, fg, head)", "GlassHomeScreen(st)")
          s = s.replace("val head = if (st == OrbState.IDLE) Sig.Red else fg", "val head = Sig.Acid")
          main.write_text(s)

          wake = root / "wake/java/com/privateai/bro/VoskWake.kt"
          wake_text = wake.read_text()
          if r', \\"hello bro\\"' not in wake_text:
              raise SystemExit("Expected Hello BRO grammar entry not found.")
          wake.write_text(wake_text.replace(r', \\"hello bro\\"', ""))
          patch(Path("main/java/com/privateai/bro/ListenService.kt"), [
              ("(Prefs.wakeOn || Prefs.clapOn)", "Prefs.wakeOn"),
              ('Prefs.wakeOn && Prefs.clapOn -> "Listening for \\"Hey Bro\\" and a double clap"\n            Prefs.wakeOn -> "Listening for \\"Hey Bro\\" / \\"Hello Bro\\""', 'Prefs.wakeOn -> "Listening for \\"Hey BRO\\""'),
              ('else -> "Listening for a double clap"', 'else -> "Wake word is disabled"'),
              ('                if (Prefs.clapOn && clap.feed(buf, n)) {\n                    fired = true\n                    main.post { Metrics.lastWake = "DOUBLE CLAP" }\n                    break\n                }\n', ''),
              ('if (!t.contains("hey bro") && !t.contains("hello bro")) return false', 'if (!t.contains("hey bro")) return false')
          ])

          # Wake only while the display is on. Screen-off wake is deliberately out of scope.
          listen = root / "main/java/com/privateai/bro/ListenService.kt"
          s = listen.read_text()
          if "import android.os.PowerManager" not in s:
              s = s.replace("import android.os.Looper", "import android.os.Looper\\nimport android.os.PowerManager")
          s = s.replace(
              '        while (alive) {\n            if (Assistant.state != OrbState.IDLE)',
              '        val power = getSystemService(PowerManager::class.java)\n        while (alive) {\n            if (!power.isInteractive) { sleep(350); continue }\n            if (Assistant.state != OrbState.IDLE)'
          )
          s = s.replace(
              '            while (alive && !fired && Assistant.state == OrbState.IDLE) {',
              '            while (alive && power.isInteractive && !fired && Assistant.state == OrbState.IDLE) {'
          )
          listen.write_text(s)

          # Force the legacy double-clap preference off so an old install cannot reactivate it.
          prefs = root / "main/java/com/privateai/bro/Prefs.kt"
          s = prefs.read_text()
          s = s.replace('get() = sp.getBoolean("clap_on", false)\\n        set(v) = sp.edit().putBoolean("clap_on", v).apply()',
                        'get() = false\\n        set(v) { sp.edit().putBoolean("clap_on", false).apply() }')
          prefs.write_text(s)

          screens = root / "main/java/com/privateai/bro/Screens2.kt"
          s = screens.read_text()
          s = s.replace("HEY BRO · HELLO BRO · DOUBLE CLAP · ONLY YOUR VOICE", "HEY BRO · SCREEN ON · WAKE WORD ONLY")
          s = s.replace("ALWAYS-ON HEY BRO / HELLO BRO", "HEY BRO WAKE WORD")
          start = s.find('        SwitchRow(\n            "DOUBLE CLAP",')
          if start >= 0:
              end = s.find('\n        if (BuildConfig.HAS_WAKE) {', start)
              if end < 0:
                  raise SystemExit("Could not locate end of legacy double-clap settings block.")
              s = s[:start] + s[end:]
          screens.write_text(s)
          print("Applied Hey BRO-only wake configuration (screen ON only), legacy clap disabled.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Gradle Kotlin DSL compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="project/app/build.gradle.kts"
          if [ -f "$BUILD_FILE" ]; then
            if ! grep -q '^import java.net.URL$' "$BUILD_FILE"; then
              sed -i '1i import java.net.URL' "$BUILD_FILE"
            fi
            sed -i 's/java\.net\.URL(url)/URL(url)/g' "$BUILD_FILE"
          fi

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          result=$?
          set -e
          cat build.log
          exit "$result"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-AI-BRO-build-logs
          path: project/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-AI-BRO-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
