name: PRIVATE AI BRO Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f BRO-source.zip
          mkdir -p project
          unzip -q -o BRO-source.zip -d project
          test -f project/settings.gradle.kts || test -f project/settings.gradle
          echo "Source archive extracted successfully."
          if [ -d source ]; then cp -a source/. project/; fi

      - name: Apply verified Kotlin source fixes and BRO configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project/app/src/main/java/com/privateai/bro")

          def read(name):
              p = root / name
              if not p.is_file():
                  raise SystemExit(f"Required source file missing: {p}")
              return p, p.read_text(encoding="utf-8")

          # Avoid Kotlin/JVM collision between the Compose state property setter and helper.
          p, s = read("Assistant.kt")
          if "fun setState(" in s:
              s = s.replace("fun setState(", "fun transitionTo(").replace("setState(", "transitionTo(")
              p.write_text(s, encoding="utf-8")
          if "fun setState(" in p.read_text(encoding="utf-8"):
              raise SystemExit("Assistant state helper rename did not apply.")

          # Keep the approved Liquid Glass home screen; do not alter the orb asset/renderer.
          p, s = read("MainActivity.kt")
          if "HomeScreen(st, fg, head)" in s:
              s = s.replace("HomeScreen(st, fg, head)", "GlassHomeScreen(st)")
          if "val head = if (st == OrbState.IDLE) Sig.Red else fg" in s:
              s = s.replace("val head = if (st == OrbState.IDLE) Sig.Red else fg", "val head = Sig.Acid")
          p.write_text(s, encoding="utf-8")
          if "GlassHomeScreen(st)" not in p.read_text(encoding="utf-8"):
              raise SystemExit("Glass home screen hook was not installed.")

          # Exact wake phrase: Hey BRO only.
          wake = Path("project/app/src/wake/java/com/privateai/bro/VoskWake.kt")
          if not wake.is_file():
              raise SystemExit("Vosk wake source is missing.")
          ws = wake.read_text(encoding="utf-8")
          if r', \"hello bro\"' in ws:
              ws = ws.replace(r', \"hello bro\"', "")
          elif r'\"hello bro\"' in ws:
              ws = ws.replace(r', \"hello bro\"', "")
          if re.search(r'\\\"hello bro\\\"', ws, flags=re.I):
              raise SystemExit("Legacy Hello BRO wake phrase still exists in Vosk grammar.")
          wake.write_text(ws, encoding="utf-8")

          p, s = read("ListenService.kt")
          s = s.replace("(Prefs.wakeOn || Prefs.clapOn)", "Prefs.wakeOn")
          s = s.replace('Prefs.wakeOn && Prefs.clapOn -> "Listening for \\"Hey Bro\\" and a double clap"\n            Prefs.wakeOn -> "Listening for \\"Hey Bro\\" / \\"Hello Bro\\""', 'Prefs.wakeOn -> "Listening for \\"Hey BRO\\""')
          s = s.replace('else -> "Listening for a double clap"', 'else -> "Wake word is disabled"')
          s = re.sub(r'\n\s*if \(Prefs\.clapOn && clap\.feed\(buf, n\)\) \{.*?\n\s*\}\n(?=\s*val hit = engine\?\.feed)', '\n', s, flags=re.S)
          s = s.replace('if (!t.contains("hey bro") && !t.contains("hello bro")) return false', 'if (!t.contains("hey bro")) return false')
          if 'hello bro' in s.lower():
              raise SystemExit("Legacy Hello BRO phrase remains in the wake acceptance path.")
          if "import android.os.PowerManager" not in s:
              s = s.replace("import android.os.Looper", "import android.os.Looper\nimport android.os.PowerManager")
          s = s.replace(
              "        while (alive) {\n            if (Assistant.state != OrbState.IDLE)",
              "        val power = getSystemService(PowerManager::class.java)\n        while (alive) {\n            if (!power.isInteractive) { sleep(350); continue }\n            if (Assistant.state != OrbState.IDLE)"
          )
          s = s.replace(
              "            while (alive && !fired && Assistant.state == OrbState.IDLE) {",
              "            while (alive && power.isInteractive && !fired && Assistant.state == OrbState.IDLE) {"
          )
          if "Prefs.clapOn && clap.feed" in s or "hello bro" in s.lower():
              raise SystemExit("Legacy wake path was not fully removed.")
          if "Prefs.wakeOn || Prefs.clapOn" in s or "!power.isInteractive" not in s or "power.isInteractive && !fired" not in s:
              raise SystemExit("Screen-on-only wake guard or Hey BRO-only service config did not apply.")
          p.write_text(s, encoding="utf-8")

          p, s = read("Prefs.kt")
          s, count = re.subn(
              r'var clapOn: Boolean\s+get\(\) = sp\.getBoolean\("clap_on", false\)\s+set\(v\) = sp\.edit\(\)\.putBoolean\("clap_on", v\)\.apply\(\)',
              'var clapOn: Boolean\n        get() = false\n        set(v) { sp.edit().putBoolean("clap_on", false).apply() }',
              s
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one clap preference block; found {count}.")
          p.write_text(s, encoding="utf-8")

          p, s = read("Screens2.kt")
          s = s.replace("HEY BRO · HELLO BRO · DOUBLE CLAP · ONLY YOUR VOICE", "HEY BRO · SCREEN ON · WAKE WORD ONLY")
          s = s.replace("THIS BUILD HAS NO WAKE-WORD ENGINE. DOUBLE CLAP AND ORB TAP STILL WORK.", "WAKE-WORD ENGINE IS NOT INCLUDED IN THIS BUILD.")
          s = s.replace("ALWAYS-ON HEY BRO / HELLO BRO", "HEY BRO WAKE WORD")
          a = s.find('        SwitchRow(\n            "DOUBLE CLAP",')
          if a >= 0:
              b = s.find('\n        if (BuildConfig.HAS_WAKE) {', a)
              if b < 0:
                  raise SystemExit("Could not safely locate the end of the double-clap settings block.")
              s = s[:a] + s[b:]
          if "DOUBLE CLAP" in s or "HELLO BRO" in s:
              raise SystemExit("Legacy wake options remain visible in settings.")
          p.write_text(s, encoding="utf-8")

          print("Source checks passed: Hey BRO only, screen-on wake, clap disabled. Existing orb renderer/assets left unchanged.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Gradle Kotlin DSL compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="project/app/build.gradle.kts"
          if [ -f "$BUILD_FILE" ]; then
            if ! grep -q '^import java.net.URL$' "$BUILD_FILE"; then
              sed -i '1i import java.net.URL' "$BUILD_FILE"
            fi
            sed -i 's/java\.net\.URL(url)/URL(url)/g' "$BUILD_FILE"
          fi

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          result=$?
          set -e
          cat build.log
          exit "$result"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-AI-BRO-build-logs
          path: project/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-AI-BRO-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
