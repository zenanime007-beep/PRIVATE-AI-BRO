name: PRIVATE AI BRO Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f BRO-source.zip
          mkdir -p project
          unzip -q -o BRO-source.zip -d project
          test -f project/settings.gradle.kts || test -f project/settings.gradle
          echo "Source archive extracted successfully."
          if [ -d source ]; then cp -a source/. project/; fi

      - name: Apply verified Kotlin source fixes and BRO configuration
        shell: bash
        run: |
          set -euo pipefail
          UI_FILE="project/app/src/main/java/com/privateai/bro/Ui.kt"
          ASSISTANT_FILE="project/app/src/main/java/com/privateai/bro/Assistant.kt"
          MAIN_FILE="project/app/src/main/java/com/privateai/bro/MainActivity.kt"
          WAKE_FILE="project/app/src/wake/java/com/privateai/bro/VoskWake.kt"
          LISTEN_FILE="project/app/src/main/java/com/privateai/bro/ListenService.kt"
          SCREENS_FILE="project/app/src/main/java/com/privateai/bro/Screens2.kt"
          test -f "$UI_FILE"
          test -f "$ASSISTANT_FILE"

          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI_FILE"

          if grep -qE 'fun[[:space:]]+setState[[:space:]]*\(' "$ASSISTANT_FILE"; then
            sed -i -E 's/\bsetState[[:space:]]*\(/transitionTo(/g' "$ASSISTANT_FILE"
          fi
          if grep -qE 'fun[[:space:]]+setState[[:space:]]*\(' "$ASSISTANT_FILE"; then
            echo "ERROR: conflicting setState method remains."
            exit 1
          fi

          sed -i 's/HomeScreen(st, fg, head)/GlassHomeScreen(st)/' "$MAIN_FILE"
          sed -i 's/val head = if (st == OrbState.IDLE) Sig.Red else fg/val head = Sig.Acid/' "$MAIN_FILE"

          # The chosen activation phrase is Hey BRO only.
          sed -i 's/"hey bro", "hello bro", "\[unk\]"/"hey bro", "[unk]"/' "$WAKE_FILE"
          sed -i 's/if (!t.contains("hey bro") \&\& !t.contains("hello bro")) return false/if (!t.contains("hey bro")) return false/' "$LISTEN_FILE"
          sed -i 's/Listening for "Hey Bro" and a double clap/Listening for "Hey BRO"/' "$LISTEN_FILE"
          sed -i 's/Listening for "Hey Bro" \/ "Hello Bro"/Listening for "Hey BRO"/' "$LISTEN_FILE"
          sed -i 's/HEY BRO · HELLO BRO · DOUBLE CLAP · ONLY YOUR VOICE/HEY BRO · OFFLINE WAKE WORD/' "$SCREENS_FILE"
          sed -i 's/ALWAYS-ON HEY BRO \/ HELLO BRO/HEY BRO WAKE WORD ONLY/' "$SCREENS_FILE"
          sed -i 's/Prefs.clapOn = clapOn/Prefs.clapOn = false/' "$SCREENS_FILE"
          sed -i 's/"DOUBLE CLAP"/"DOUBLE CLAP (DISABLED)"/' "$SCREENS_FILE"
          sed -i 's/clapOn, true, fg/false, false, fg/' "$SCREENS_FILE"
          echo "BRO wake phrase restricted to Hey BRO."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Gradle Kotlin DSL compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="project/app/build.gradle.kts"
          if [ -f "$BUILD_FILE" ]; then
            if ! grep -q '^import java.net.URL$' "$BUILD_FILE"; then
              sed -i '1i import java.net.URL' "$BUILD_FILE"
            fi
            sed -i 's/java\.net\.URL(url)/URL(url)/g' "$BUILD_FILE"
          fi

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          result=$?
          set -e
          cat build.log
          exit "$result"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-AI-BRO-build-logs
          path: project/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-AI-BRO-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
